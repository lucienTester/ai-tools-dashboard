<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 编程工具 TOP10 评测报告 - 2026-05-15</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; color: #1a1a2e; margin-bottom: 8px; font-size: 28px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  h2 { color: #16213e; margin-bottom: 16px; font-size: 18px; border-left: 4px solid #4361ee; padding-left: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: #fff; padding: 12px 8px; text-align: center; }
  td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #eee; }
  tr:hover { background: #f8f9ff; }
  .rank { display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; color: #fff; font-weight: bold; font-size: 13px; }
  .rank-1 { background: linear-gradient(135deg, #ffd700, #ff8c00); }
  .rank-2 { background: linear-gradient(135deg, #c0c0c0, #888); }
  .rank-3 { background: linear-gradient(135deg, #cd7f32, #8B4513); }
  .rank-other { background: #4361ee; }
  .score-bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 4px; }
  .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4361ee, #3a0ca3); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .chart-box { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .chart-box h3 { font-size: 15px; color: #333; margin-bottom: 12px; text-align: center; }
  .footer { text-align: center; color: #999; font-size: 12px; padding: 20px; border-top: 1px solid #eee; margin-top: 20px; }
  .footer a { color: #4361ee; text-decoration: none; }
  .highlight { color: #4361ee; font-weight: 600; }
  @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } table { font-size: 12px; } }
</style>
</head>
<body>
<div class="container">
  <h1>🚀 AI 编程工具 TOP10 评测报告</h1>
  <p class="subtitle">生成日期：2026-05-15 ｜ 数据基于 LMArena Elo / SWE-bench / HumanEval / MBPP 综合评分</p>

  <div class="card">
    <h2>📊 综合排名</h2>
    <table>
      <thead>
        <tr>
          <th>排名</th><th>模型</th><th>公司</th><th>Elo</th><th>SWE-bench</th><th>HumanEval</th><th>MBPP</th><th>综合评分</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="chart-grid">
    <div class="chart-box"><h3>Elo 评分对比</h3><canvas id="chartElo"></canvas></div>
    <div class="chart-box"><h3>SWE-bench 对比</h3><canvas id="chartSwe"></canvas></div>
    <div class="chart-box"><h3>HumanEval 对比</h3><canvas id="chartHuman"></canvas></div>
    <div class="chart-box"><h3>MBPP 雷达图</h3><canvas id="chartMbpp"></canvas></div>
  </div>

  <div class="footer">
    <p>数据来源：
      <a href="https://lmarena.ai" target="_blank">LMArena</a> ·
      <a href="https://www.swebench.com" target="_blank">SWE-bench</a> ·
      <a href="https://humaneval.com" target="_blank">HumanEval</a> ·
      <a href="https://mbpp.io" target="_blank">MBPP</a>
    </p>
    <p style="margin-top:6px">由 Knot AI 自动生成 ｜ <a href="https://lucienTester.github.io/ai-tools-dashboard/" target="_blank">查看历史报告</a></p>
  </div>
</div>

<script>
const data = [
  { rank:1, model:"Claude 4.6 Sonnet", company:"Anthropic", elo:1538, swe:83.2, human:94.1, mbpp:87.6, score:95.1 },
  { rank:2, model:"Gemini 3.0 Pro", company:"Google DeepMind", elo:1512, swe:81.8, human:92.3, mbpp:85.4, score:93.4 },
  { rank:3, model:"GPT-5 High", company:"OpenAI", elo:1498, swe:80.5, human:91.8, mbpp:84.2, score:92.0 },
  { rank:4, model:"DeepSeek V4", company:"DeepSeek", elo:1476, swe:80.1, human:95.3, mbpp:88.7, score:91.8 },
  { rank:5, model:"Kimi 2.5", company:"月之暗面", elo:1452, swe:78.6, human:90.2, mbpp:83.1, score:89.5 },
  { rank:6, model:"GLM-5", company:"智谱AI", elo:1448, swe:77.9, human:89.4, mbpp:82.5, score:88.9 },
  { rank:7, model:"Cursor (Agent 2.0)", company:"Anysphere", elo:1441, swe:76.8, human:88.1, mbpp:81.3, score:88.2 },
  { rank:8, model:"Qwen3-Coder 72B", company:"阿里云", elo:1435, swe:76.2, human:87.5, mbpp:80.8, score:87.6 },
  { rank:9, model:"GitHub Copilot X", company:"GitHub/OpenAI", elo:1428, swe:75.1, human:86.3, mbpp:79.4, score:86.8 },
  { rank:10, model:"Mistral Large 3", company:"Mistral AI", elo:1415, swe:73.8, human:84.7, mbpp:77.9, score:85.3 }
];

const labels = data.map(d => d.model);
const rankClass = r => r <= 3 ? `rank-${r}` : 'rank-other';

document.getElementById('tableBody').innerHTML = data.map(d => `
  <tr>
    <td><span class="rank ${rankClass(d.rank)}">${d.rank}</span></td>
    <td class="highlight">${d.model}</td>
    <td>${d.company}</td>
    <td>${d.elo}</td>
    <td>${d.swe}</td>
    <td>${d.human}</td>
    <td>${d.mbpp}</td>
    <td>
      ${d.score}
      <div class="score-bar"><div class="score-fill" style="width:${d.score}%"></div></div>
    </td>
  </tr>
`).join('');

const baseOpts = { responsive:true, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:false } } };

new Chart(chartElo, {
  type:'bar',
  data:{ labels, datasets:[{ data:data.map(d=>d.elo), backgroundColor:'rgba(67,97,238,0.7)', borderRadius:6 }] },
  options:{ ...baseOpts, scales:{ y:{ min:1400, max:1560, title:{display:true,text:'Elo'} } } }
});

new Chart(chartSwe, {
  type:'bar',
  data:{ labels, datasets:[{ data:data.map(d=>d.swe), backgroundColor:'rgba(76,175,80,0.7)', borderRadius:6 }] },
  options:{ ...baseOpts, scales:{ y:{ min:70, max:90, title:{display:true,text:'SWE-bench (%)'} } } }
});

new Chart(chartHuman, {
  type:'line',
  data:{ labels, datasets:[{ data:data.map(d=>d.human), borderColor:'#ff6384', backgroundColor:'rgba(255,99,132,0.1)', fill:true, tension:0.3, pointRadius:5 }] },
  options:{ ...baseOpts, scales:{ y:{ min:82, max:100, title:{display:true,text:'HumanEval (%)'} } } }
});

new Chart(chartMbpp, {
  type:'radar',
  data:{
    labels,
    datasets: data.map((d,i) => ({
      label: d.model,
      data: [d.mbpp],
      borderColor: `hsl(${i*36},70%,50%)`,
      backgroundColor: `hsla(${i*36},70%,50%,0.1)`,
      pointRadius: 3
    }))
  },
  options:{ responsive:true, plugins:{ legend:{display:false} }, scales:{ r:{ min:75, max:90 } } }
});
</script>
</body>
</html>
