<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI编程工具 TOP10 评测报告 - 2026-05-16</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e27; color: #e0e0e0; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { text-align: center; color: #00d4ff; font-size: 2em; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,212,255,0.3); }
  .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }
  .card { background: #111638; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #1e2a5a; }
  h2 { color: #00d4ff; font-size: 1.2em; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #1e2a5a; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #1a237e; color: #00d4ff; padding: 10px; text-align: left; font-size: 0.85em; }
  td { padding: 10px; border-bottom: 1px solid #1a1a4e; font-size: 0.85em; }
  tr:hover { background: #1a1a4e; }
  .rank-1 { color: #ffd700; font-weight: bold; }
  .rank-2 { color: #c0c0c0; font-weight: bold; }
  .rank-3 { color: #cd7f32; font-weight: bold; }
  .score-bar { height: 6px; background: #1a1a4e; border-radius: 3px; margin-top: 4px; }
  .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #00d4ff, #00ff88); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .chart-box { background: #111638; border-radius: 12px; padding: 20px; border: 1px solid #1e2a5a; }
  .chart-box h3 { color: #00d4ff; font-size: 1em; margin-bottom: 12px; text-align: center; }
  .footer { text-align: center; color: #555; font-size: 0.8em; margin-top: 30px; padding-top: 20px; border-top: 1px solid #1e2a5a; }
  .footer a { color: #00d4ff; text-decoration: none; }
  .highlight { color: #00ff88; font-weight: bold; }
  @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>🚀 AI编程工具 TOP10 评测报告</h1>
  <p class="subtitle">生成日期：2026-05-16 | 数据基于 LMArena Elo / SWE-bench / HumanEval / MBPP 综合评分</p>

  <div class="card">
    <h2>📊 排名数据</h2>
    <table>
      <thead>
        <tr>
          <th>排名</th><th>模型</th><th>公司</th><th>Elo</th><th>SWE-bench</th><th>HumanEval</th><th>MBPP</th><th>综合评分</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="chart-grid">
    <div class="chart-box"><h3>Elo 评分（LMArena）</h3><canvas id="eloChart"></canvas></div>
    <div class="chart-box"><h3>SWE-bench 得分</h3><canvas id="sweChart"></canvas></div>
    <div class="chart-box"><h3>HumanEval 得分</h3><canvas id="humanChart"></canvas></div>
    <div class="chart-box"><h3>MBPP 多维雷达图</h3><canvas id="radarChart"></canvas></div>
  </div>

  <div class="footer">
    <p>数据来源：
      <a href="https://lmarena.ai" target="_blank">LMArena</a> ·
      <a href="https://www.swebench.com" target="_blank">SWE-bench</a> ·
      <a href="https://humaneval.org" target="_blank">HumanEval</a> ·
      <a href="https://mbpp.io" target="_blank">MBPP</a>
    </p>
    <p style="margin-top:8px">由 Knot AI Agent 自动生成 | <a href="https://lucienTester.github.io/ai-tools-dashboard/">返回看板</a></p>
  </div>
</div>

<script>
const data = [
  { rank:1, model:"Claude 4.6 Sonnet", company:"Anthropic", elo:1538, sweBench:83.2, humanEval:94.1, mbpp:87.6, score:95.1 },
  { rank:2, model:"Gemini 3.0 Pro", company:"Google DeepMind", elo:1512, sweBench:81.8, humanEval:92.3, mbpp:85.4, score:93.4 },
  { rank:3, model:"GPT-5 High", company:"OpenAI", elo:1498, sweBench:80.5, humanEval:91.8, mbpp:84.2, score:92.0 },
  { rank:4, model:"DeepSeek V4", company:"DeepSeek", elo:1476, sweBench:80.1, humanEval:95.3, mbpp:88.7, score:91.8 },
  { rank:5, model:"Kimi 2.5", company:"月之暗面", elo:1452, sweBench:78.6, humanEval:90.2, mbpp:83.1, score:89.5 },
  { rank:6, model:"GLM-5", company:"智谱AI", elo:1448, sweBench:77.9, humanEval:89.4, mbpp:82.5, score:88.9 },
  { rank:7, model:"Cursor (Agent 2.0)", company:"Anysphere", elo:1441, sweBench:76.8, humanEval:88.1, mbpp:81.3, score:88.2 },
  { rank:8, model:"Qwen3-Coder 72B", company:"阿里云", elo:1435, sweBench:76.2, humanEval:87.5, mbpp:80.8, score:87.6 },
  { rank:9, model:"GitHub Copilot X", company:"GitHub/OpenAI", elo:1428, sweBench:75.1, humanEval:86.3, mbpp:79.4, score:86.8 },
  { rank:10, model:"Mistral Large 3", company:"Mistral AI", elo:1415, sweBench:73.8, humanEval:84.7, mbpp:77.9, score:85.3 }
];

const labels = data.map(d => d.model);
const colors = ['#ffd700','#c0c0c0','#cd7f32','#00d4ff','#00d4ff','#00d4ff','#00d4ff','#00d4ff','#00d4ff','#00d4ff'];

// 填充表格
const tbody = document.getElementById('tableBody');
data.forEach(d => {
  const rankClass = d.rank <= 3 ? `rank-${d.rank}` : '';
  tbody.innerHTML += `
    <tr>
      <td class="${rankClass}">#${d.rank}</td>
      <td><span class="highlight">${d.model}</span></td>
      <td>${d.company}</td>
      <td>${d.elo}</td>
      <td>${d.sweBench}</td>
      <td>${d.humanEval}</td>
      <td>${d.mbpp}</td>
      <td>
        ${d.score}
        <div class="score-bar"><div class="score-fill" style="width:${d.score}%"></div></div>
      </td>
    </tr>`;
});

const chartOpts = (yMin, yMax) => ({
  responsive: true,
  plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1a237e', titleColor: '#00d4ff' } },
  scales: {
    y: { min: yMin, max: yMax, grid: { color: '#1e2a5a' }, ticks: { color: '#888' } },
    x: { grid: { color: '#1e2a5a' }, ticks: { color: '#888', maxRotation: 45 } }
  }
});

new Chart(document.getElementById('eloChart'), {
  type: 'bar',
  data: { labels, datasets: [{ data: data.map(d => d.elo), backgroundColor: colors, borderRadius: 4 }] },
  options: chartOpts(1400, 1560)
});

new Chart(document.getElementById('sweChart'), {
  type: 'bar',
  data: { labels, datasets: [{ data: data.map(d => d.sweBench), backgroundColor: colors, borderRadius: 4 }] },
  options: chartOpts(70, 86)
});

new Chart(document.getElementById('humanChart'), {
  type: 'line',
  data: { labels, datasets: [{ data: data.map(d => d.humanEval), borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.1)', fill: true, tension: 0.3, pointBackgroundColor: colors }] },
  options: chartOpts(82, 97)
});

new Chart(document.getElementById('radarChart'), {
  type: 'radar',
  data: {
    labels: data.map(d => d.model),
    datasets: [
      { label: 'Elo', data: data.map(d => d.elo/15.38), borderColor: '#ffd700', backgroundColor: 'rgba(255,215,0,0.1)' },
      { label: 'SWE-bench', data: data.map(d => d.sweBench), borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.1)' },
      { label: 'HumanEval', data: data.map(d => d.humanEval), borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,0.1)' },
      { label: 'MBPP', data: data.map(d => d.mbpp), borderColor: '#ff6b6b', backgroundColor: 'rgba(255,107,107,0.1)' }
    ]
  },
  options: {
    responsive: true,
    plugins: { legend: { labels: { color: '#888' } } },
    scales: { r: { grid: { color: '#1e2a5a' }, pointLabels: { color: '#888', font: { size: 10 } }, ticks: { color: '#888', backdropColor: 'transparent' } } }
  }
});
</script>
</body>
</html>
