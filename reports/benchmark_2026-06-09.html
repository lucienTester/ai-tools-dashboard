<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI编程工具 TOP10 评测报告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#e0e0e0;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 20px 30px;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.15));border-radius:16px;margin-bottom:30px;border:1px solid rgba(139,92,246,.2)}
header h1{font-size:2.2em;background:linear-gradient(90deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
header .subtitle{color:#a5b4fc;font-size:1.1em}
header .date{color:#94a3b8;font-size:.9em;margin-top:6px}
.section{background:rgba(30,27,75,.6);border-radius:16px;padding:24px;margin-bottom:24px;border:1px solid rgba(139,92,246,.15);backdrop-filter:blur(10px)}
.section h2{font-size:1.4em;margin-bottom:16px;color:#c4b5fd;display:flex;align-items:center;gap:8px}
.section h2::before{content:'📊';font-size:1.1em}
table{width:100%;border-collapse:collapse;font-size:.92em}
th{background:rgba(139,92,246,.2);color:#c4b5fd;padding:12px 10px;text-align:center;font-weight:600;white-space:nowrap}
td{padding:10px;text-align:center;border-bottom:1px solid rgba(139,92,246,.1);white-space:nowrap}
tr:hover{background:rgba(139,92,246,.08)}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:.9em}
.rank-1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a2e}
.rank-2{background:linear-gradient(135deg,#d1d5db,#9ca3af);color:#1a1a2e}
.rank-3{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.rank-n{background:rgba(139,92,246,.15);color:#a5b4fc}
.score-bar{display:flex;align-items:center;gap:6px;justify-content:center}
.score-bar .bar{width:80px;height:8px;background:rgba(139,92,246,.15);border-radius:4px;overflow:hidden}
.score-bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#818cf8,#c084fc)}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-box{background:rgba(20,17,60,.5);border-radius:12px;padding:16px;border:1px solid rgba(139,92,246,.1)}
.chart-box h3{font-size:1em;color:#a5b4fc;margin-bottom:12px;text-align:center}
.chart-box canvas{width:100%!important;max-height:280px}
footer{text-align:center;padding:24px;color:#64748b;font-size:.85em;border-top:1px solid rgba(139,92,246,.1);margin-top:20px}
footer .sources{margin-top:6px;color:#475569}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}header h1{font-size:1.6em}table{font-size:.8em}th,td{padding:8px 6px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🏆 AI编程工具 TOP10 评测报告</h1>
<div class="subtitle">基于 LMArena Elo / SWE-bench / HumanEval / MBPP 综合评测</div>
<div class="date">报告日期：2026-06-09</div>
</header>

<div class="section">
<h2>评测数据总览</h2>
<table>
<thead><tr><th>排名</th><th>模型</th><th>公司</th><th>Elo</th><th>SWE-bench</th><th>HumanEval</th><th>MBPP</th><th>综合评分</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="section">
<h2>可视化分析</h2>
<div class="charts-grid">
<div class="chart-box"><h3>📈 Elo 评分柱状图</h3><canvas id="eloChart"></canvas></div>
<div class="chart-box"><h3>🔧 SWE-bench 柱状图</h3><canvas id="sweChart"></canvas></div>
<div class="chart-box"><h3>💡 HumanEval 折线图</h3><canvas id="humanChart"></canvas></div>
<div class="chart-box"><h3>🎯 MBPP 雷达图</h3><canvas id="mbppRadar"></canvas></div>
</div>
</div>

<footer>
<p>AI编程工具 TOP10 评测报告 · 自动生成于 2026-06-09</p>
<p class="sources">数据来源：LMArena · SWE-bench · HumanEval · MBPP</p>
</footer>
</div>

<script>
const data=[
  {rank:1,model:"Claude 4.6 Sonnet",company:"Anthropic",elo:1538,sweBench:83.2,humanEval:94.1,mbpp:87.6,score:95.1},
  {rank:2,model:"Gemini 3.0 Pro",company:"Google DeepMind",elo:1512,sweBench:81.8,humanEval:92.3,mbpp:85.4,score:93.4},
  {rank:3,model:"GPT-5 High",company:"OpenAI",elo:1498,sweBench:80.5,humanEval:91.8,mbpp:84.2,score:92.0},
  {rank:4,model:"DeepSeek V4",company:"DeepSeek",elo:1476,sweBench:80.1,humanEval:95.3,mbpp:88.7,score:91.8},
  {rank:5,model:"Kimi 2.5",company:"月之暗面",elo:1452,sweBench:78.6,humanEval:90.2,mbpp:83.1,score:89.5},
  {rank:6,model:"GLM-5",company:"智谱AI",elo:1448,sweBench:77.9,humanEval:89.4,mbpp:82.5,score:88.9},
  {rank:7,model:"Cursor (Agent 2.0)",company:"Anysphere",elo:1441,sweBench:76.8,humanEval:88.1,mbpp:81.3,score:88.2},
  {rank:8,model:"Qwen3-Coder 72B",company:"阿里云",elo:1435,sweBench:76.2,humanEval:87.5,mbpp:80.8,score:87.6},
  {rank:9,model:"GitHub Copilot X",company:"GitHub/OpenAI",elo:1428,sweBench:75.1,humanEval:86.3,mbpp:79.4,score:86.8},
  {rank:10,model:"Mistral Large 3",company:"Mistral AI",elo:1415,sweBench:73.8,humanEval:84.7,mbpp:77.9,score:85.3}
];

// Render table
const tbody=document.getElementById('tableBody');
data.forEach(d=>{
  const rc=d.rank<=3?`rank-${d.rank}`:'rank-n';
  const pct=((d.score-80)/20*100).toFixed(0);
  tbody.innerHTML+=`<tr>
    <td><span class="rank-badge ${rc}">${d.rank}</span></td>
    <td style="text-align:left;font-weight:600;color:#e0e7ff">${d.model}</td>
    <td style="color:#94a3b8">${d.company}</td>
    <td>${d.elo}</td>
    <td>${d.sweBench}%</td>
    <td>${d.humanEval}%</td>
    <td>${d.mbpp}%</td>
    <td><div class="score-bar"><span style="font-weight:700;color:#c084fc">${d.score}</span><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div></td>
  </tr>`;
});

const labels=data.map(d=>d.model.length>14?d.model.slice(0,13)+'…':d.model);
const colors=['#818cf8','#a78bfa','#c084fc','#e879f9','#f472b6','#fb923c','#facc15','#4ade80','#22d3ee','#60a5fa'];

const cOpt={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(139,92,246,.08)'}},y:{ticks:{color:'#94a3b8'},grid:{color:'rgba(139,92,246,.08)'}}}};

// Elo bar
new Chart(document.getElementById('eloChart'),{type:'bar',data:{labels,datasets:[{data:data.map(d=>d.elo),backgroundColor:colors.map(c=>c+'cc'),borderColor:colors,borderWidth:1,borderRadius:4}]},options:{...cOpt,scales:{...cOpt.scales,y:{...cOpt.scales.y,beginAtZero:false,min:1400}}}});

// SWE-bench bar
new Chart(document.getElementById('sweChart'),{type:'bar',data:{labels,datasets:[{data:data.map(d=>d.sweBench),backgroundColor:colors.map(c=>c+'cc'),borderColor:colors,borderWidth:1,borderRadius:4}]},options:{...cOpt,scales:{...cOpt.scales,y:{...cOpt.scales.y,beginAtZero:false,min:70}}}});

// HumanEval line
new Chart(document.getElementById('humanChart'),{type:'line',data:{labels,datasets:[{data:data.map(d=>d.humanEval),borderColor:'#c084fc',backgroundColor:'rgba(192,132,252,.1)',fill:true,tension:.4,pointBackgroundColor:colors,pointRadius:5,pointBorderColor:'#fff',pointBorderWidth:1}]},options:{...cOpt,scales:{...cOpt.scales,y:{...cOpt.scales.y,beginAtZero:false,min:82}}}});

// MBPP radar (top 5)
const top5=data.slice(0,5);
new Chart(document.getElementById('mbppRadar'),{type:'radar',data:{labels:top5.map(d=>d.model.length>12?d.model.slice(0,11)+'…':d.model),datasets:[{label:'MBPP',data:top5.map(d=>d.mbpp),backgroundColor:'rgba(129,140,248,.15)',borderColor:'#818cf8',pointBackgroundColor:colors.slice(0,5),pointRadius:5},{label:'HumanEval',data:top5.map(d=>d.humanEval),backgroundColor:'rgba(192,132,252,.1)',borderColor:'#c084fc',pointBackgroundColor:colors.slice(0,5),pointRadius:5},{label:'SWE-bench',data:top5.map(d=>d.sweBench),backgroundColor:'rgba(244,114,182,.1)',borderColor:'#f472b6',pointBackgroundColor:colors.slice(0,5),pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a5b4fc',font:{size:11}}}},scales:{r:{grid:{color:'rgba(139,92,246,.15)'},angleLines:{color:'rgba(139,92,246,.1)'},pointLabels:{color:'#94a3b8',font:{size:10}},ticks:{display:false},suggestedMin:70}}}});
</script>
</body>
</html>
