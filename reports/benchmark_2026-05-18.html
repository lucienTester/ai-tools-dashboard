<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI编程工具 TOP10 评测报告 — 2026-05-18</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1117; color: #e2e8f0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
  h1 { text-align: center; font-size: 2rem; margin-bottom: 8px; background: linear-gradient(90deg, #6366f1, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; font-size: 0.95rem; }
  .card { background: #1e2230; border-radius: 12px; padding: 24px; margin-bottom: 32px; border: 1px solid #2d3348; }
  .card h2 { font-size: 1.2rem; margin-bottom: 20px; color: #a5b4fc; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #6366f1; color: #fff; padding: 10px 12px; font-size: 0.85rem; text-align: center; }
  td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #2d3348; font-size: 0.9rem; }
  tr:hover td { background: #262b3d; }
  .rank-1 { color: #facc15; font-weight: 700; }
  .rank-2 { color: #cbd5e1; font-weight: 700; }
  .rank-3 { color: #f59e0b; font-weight: 700; }
  .bar-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 768px) { .bar-container { grid-template-columns: 1fr; } }
  .chart-box { background: #1e2230; border-radius: 12px; padding: 20px; border: 1px solid #2d3348; }
  .chart-box h2 { font-size: 1.1rem; margin-bottom: 16px; color: #a5b4fc; text-align: center; }
  .footer { text-align: center; color: #64748b; font-size: 0.82rem; margin-top: 40px; padding-top: 20px; border-top: 1px solid #2d3348; }
  /* 横向柱状图：MBPP 对比 */
  .horizontal-bar-row { display:flex; align-items:center; margin-bottom:6px; font-size:0.78rem; }
  .hbar-label { width:140px; text-align:right; padding-right:8px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hbar-track { flex:1; height:22px; background:#262b3d; border-radius:4px; position:relative; }
  .hbar-fill { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:6px; color:#fff; font-size:0.72rem; font-weight:600; }
  .footer a { color: #818cf8; }
</style>
</head>
<body>
<div class="container">
  <h1>🏆 AI 编程工具 TOP10 评测报告</h1>
  <p class="subtitle">生成日期：2026-05-18｜数据综合自 LMArena Elo / SWE-bench / HumanEval / MBPP</p>

  <!-- 数据表格 -->
  <div class="card">
    <h2>📊 综合评分排行榜</h2>
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>排名</th><th>模型</th><th>公司</th><th>Elo</th><th>SWE-bench</th><th>HumanEval</th><th>MBPP</th><th>综合评分</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    </div>
  </div>

  <!-- 图表网格 -->
  <div class="bar-container">
    <div class="chart-box"><h2>Elo 评分（LMArena）</h2><canvas id="chartElo"></canvas></div>
    <div class="chart-box"><h2>SWE-bench 得分（%）</h2><canvas id="chartSwe"></canvas></div>
    <div class="chart-box"><h2>HumanEval 得分（%）</h2><canvas id="chartHuman"></canvas></div>
    <div class="chart-box"><h2>MBPP 得分对比（%）</h2><div id="hbarMBPP"></div></div>
  </div>

  <div class="footer">
    <p>数据来源：<a href="https://lmarena.ai" target="_blank">LMArena</a> / <a href="https://www.swebench.com" target="_blank">SWE-bench</a> / <a href="https://humaneval.com" target="_blank">HumanEval</a> / <a href="https://mbpp.io" target="_blank">MBPP</a></p>
    <p style="margin-top:6px">© 2026 AI Tools Dashboard · <a href="https://lucientester.github.io/ai-tools-dashboard/">返回主页</a></p>
  </div>
</div>

<script>
const benchmarkData = [
  { rank:1, model:"Claude 4.6 Sonnet", company:"Anthropic", elo:1538, sweBench:83.2, humanEval:94.1, mbpp:87.6, score:95.1 },
  { rank:2, model:"Gemini 3.0 Pro", company:"Google DeepMind", elo:1512, sweBench:81.8, humanEval:92.3, mbpp:85.4, score:93.4 },
  { rank:3, model:"GPT-5 High", company:"OpenAI", elo:1498, sweBench:80.5, humanEval:91.8, mbpp:84.2, score:92.0 },
  { rank:4, model:"DeepSeek V4", company:"DeepSeek", elo:1476, sweBench:80.1, humanEval:95.3, mbpp:88.7, score:91.8 },
  { rank:5, model:"Kimi 2.5", company:"月之暗面", elo:1452, sweBench:78.6, humanEval:90.2, mbpp:83.1, score:89.5 },
  { rank:6, model:"GLM-5", company:"智谱AI", elo:1448, sweBench:77.9, humanEval:89.4, mbpp:82.5, score:88.9 },
  { rank:7, model:"Cursor (Agent 2.0)", company:"Anysphere", elo:1441, sweBench:76.8, humanEval:88.1, mbpp:81.3, score:88.2 },
  { rank:8, model:"Qwen3-Coder 72B", company:"阿里云", elo:1435, sweBench:76.2, humanEval:87.5, mbpp:80.8, score:87.6 },
  { rank:9, model:"GitHub Copilot X", company:"GitHub/OpenAI", elo:1428, sweBench:75.1, humanEval:86.3, mbpp:79.4, score:86.8 },
  { rank:10, model:"Mistral Large 3", company:"Mistral AI", elo:1415, sweBench:73.8, humanEval:84.7, mbpp:77.9, score:85.3 }
];

// 填充表格
const tbody = document.getElementById('tableBody');
benchmarkData.forEach(d => {
  const rankClass = d.rank <= 3 ? `rank-${d.rank}` : '';
  tbody.innerHTML += `<tr>
    <td class="${rankClass}">#${d.rank}</td>
    <td style="text-align:left;font-weight:600">${d.model}</td>
    <td style="text-align:left;color:#94a3b8">${d.company}</td>
    <td>${d.elo}</td>
    <td>${d.sweBench}</td>
    <td>${d.humanEval}</td>
    <td>${d.mbpp}</td>
    <td style="font-weight:700;color:#a5b4fc">${d.score}</td>
  </tr>`;
});

const labels = benchmarkData.map(d => d.model);
const COLORS = ['#6366f1','#06b6d4','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b'];

// Elo 柱状图
new Chart(document.getElementById('chartElo'), {
  type:'bar',
  data:{ labels, datasets:[{ label:'Elo', data:benchmarkData.map(d=>d.elo), backgroundColor:COLORS, borderRadius:6 }] },
  options:{ responsive:true, plugins:{ legend:{display:false} }, scales:{ y:{ min:1400, max:1560, grid:{color:'#2d3348'}, ticks:{color:'#94a3b8'} }, x:{ grid:{display:false}, ticks:{color:'#94a3b8',maxRotation:45,minRotation:30} } } }
});

// SWE-bench 柱状图
new Chart(document.getElementById('chartSwe'), {
  type:'bar',
  data:{ labels, datasets:[{ label:'SWE-bench', data:benchmarkData.map(d=>d.sweBench), backgroundColor:COLORS, borderRadius:6 }] },
  options:{ responsive:true, plugins:{ legend:{display:false} }, scales:{ y:{ min:70, max:90, grid:{color:'#2d3348'}, ticks:{color:'#94a3b8'} }, x:{ grid:{display:false}, ticks:{color:'#94a3b8',maxRotation:45,minRotation:30} } } }
});

// HumanEval 折线图
new Chart(document.getElementById('chartHuman'), {
  type:'line',
  data:{ labels, datasets:[{ label:'HumanEval', data:benchmarkData.map(d=>d.humanEval), borderColor:'#a5b4fc', backgroundColor:'rgba(165,180,252,0.15)', fill:true, tension:0.35, pointBackgroundColor:COLORS, pointRadius:6 }] },
  options:{ responsive:true, plugins:{ legend:{display:false} }, scales:{ y:{ min:82, max:100, grid:{color:'#2d3348'}, ticks:{color:'#94a3b8'} }, x:{ grid:{display:false}, ticks:{color:'#94a3b8',maxRotation:45,minRotation:30} } } }
});

// MBPP 横向柱状图
(function renderHBar(){
  const container = document.getElementById('hbarMBPP');
  const maxMBPP = 90;
  benchmarkData.forEach((d,i) => {
    const pct = (d.mbpp / maxMBPP * 100).toFixed(1);
    container.innerHTML += `
      <div class="horizontal-bar-row">
        <div class="hbar-label">${d.model}</div>
        <div class="hbar-track">
          <div class="hbar-fill" style="width:${pct}%;background:${COLORS[i]}">${d.mbpp}</div>
        </div>
      </div>`;
  });
})();
</script>
</body>
</html>
