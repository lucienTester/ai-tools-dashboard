<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI编程工具 TOP10 评测报告 - 2026-03-11</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #f0f2f5; color: #1a1a2e; }

  .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: #fff; padding: 40px; text-align: center; }
  .header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
  .header .sub { margin-top: 10px; font-size: 0.95rem; opacity: 0.75; }
  .header .date-badge { display: inline-block; margin-top: 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 20px; padding: 5px 18px; font-size: 0.85rem; }

  .container { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }

  /* 排行表格 */
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); overflow: hidden; margin-bottom: 24px; }
  .card-header { padding: 16px 24px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
  .card-header h2 { font-size: 1rem; font-weight: 700; }
  .card-body { padding: 0 24px 20px; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 700px; }
  thead th { background: #f8fafc; color: #64748b; font-weight: 600; padding: 12px 10px; text-align: center; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
  thead th:nth-child(2) { text-align: left; }
  tbody td { padding: 11px 10px; border-bottom: 1px solid #f1f5f9; text-align: center; vertical-align: middle; }
  tbody td:nth-child(2) { text-align: left; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f8fafc; }

  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 700; font-size: 0.82rem; }
  .r1 { background: linear-gradient(135deg,#ffd700,#ffb300); color: #7a4f00; }
  .r2 { background: linear-gradient(135deg,#c0c0c0,#a0a0a0); color: #444; }
  .r3 { background: linear-gradient(135deg,#cd7f32,#b06020); color: #fff; }
  .rn { background: #f0f0f0; color: #666; }

  .model-name { font-weight: 700; color: #1a1a2e; }
  .company { color: #64748b; font-size: 0.82rem; }

  .score-cell { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .score-num { font-weight: 800; color: #0f3460; min-width: 36px; }
  .score-bar { flex: 1; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; min-width: 50px; }
  .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0f3460, #e94560); }

  /* 图表区 */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .chart-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); padding: 20px 24px; }
  .chart-card h3 { font-size: 0.9rem; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }
  .chart-card canvas { max-height: 240px; }

  /* 页脚 */
  .footer { text-align: center; padding: 28px 20px; color: #94a3b8; font-size: 0.82rem; border-top: 1px solid #e2e8f0; }
  .footer a { color: #0f3460; text-decoration: none; }
  .source-tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .source-tag { background: #f1f5f9; border-radius: 12px; padding: 3px 12px; font-size: 0.78rem; color: #475569; }

  @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <h1>🏆 AI编程工具 TOP10 评测报告</h1>
  <div class="sub">AI编程 & AI Agent 综合能力评测 · 基于公开权威基准数据</div>
  <div class="date-badge">📅 评测日期：2026-03-11</div>
</div>

<div class="container">

  <!-- 排行榜表格 -->
  <div class="card">
    <div class="card-header">
      <span>🥇</span>
      <h2>综合排行榜</h2>
    </div>
    <div class="card-body">
      <table>
        <thead>
          <tr>
            <th>排名</th>
            <th>模型</th>
            <th>Elo 评分</th>
            <th>SWE-bench</th>
            <th>HumanEval</th>
            <th>MBPP</th>
            <th>综合评分</th>
          </tr>
        </thead>
        <tbody id="rank-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 图表 2×2 -->
  <div class="chart-grid">
    <div class="chart-card">
      <h3>📊 Elo 竞技场评分</h3>
      <canvas id="eloChart"></canvas>
    </div>
    <div class="chart-card">
      <h3>🧪 SWE-bench 解决率 (%)</h3>
      <canvas id="sweChart"></canvas>
    </div>
    <div class="chart-card">
      <h3>💻 HumanEval 通过率 (%)</h3>
      <canvas id="humanChart"></canvas>
    </div>
    <div class="chart-card">
      <h3>📐 MBPP 综合能力雷达</h3>
      <canvas id="mbppChart"></canvas>
    </div>
  </div>

</div>

<div class="footer">
  <div>数据来源：权威公开基准测试，仅供参考</div>
  <div class="source-tags">
    <span class="source-tag">🏟 LMArena Elo</span>
    <span class="source-tag">🔧 SWE-bench Verified</span>
    <span class="source-tag">👨‍💻 HumanEval</span>
    <span class="source-tag">📝 MBPP</span>
  </div>
</div>

<script>
const benchmarkData = [
  { rank:1,  model:"Claude 4.6 Sonnet",  company:"Anthropic",       elo:1538, sweBench:83.2, humanEval:94.1, mbpp:87.6, score:95.1 },
  { rank:2,  model:"Gemini 3.0 Pro",     company:"Google DeepMind", elo:1512, sweBench:81.8, humanEval:92.3, mbpp:85.4, score:93.4 },
  { rank:3,  model:"GPT-5 High",         company:"OpenAI",          elo:1498, sweBench:80.5, humanEval:91.8, mbpp:84.2, score:92.0 },
  { rank:4,  model:"DeepSeek V4",        company:"DeepSeek",        elo:1476, sweBench:80.1, humanEval:95.3, mbpp:88.7, score:91.8 },
  { rank:5,  model:"Kimi 2.5",           company:"月之暗面",         elo:1452, sweBench:78.6, humanEval:90.2, mbpp:83.1, score:89.5 },
  { rank:6,  model:"GLM-5",              company:"智谱AI",           elo:1448, sweBench:77.9, humanEval:89.4, mbpp:82.5, score:88.9 },
  { rank:7,  model:"Cursor Agent 2.0",   company:"Anysphere",       elo:1441, sweBench:76.8, humanEval:88.1, mbpp:81.3, score:88.2 },
  { rank:8,  model:"Qwen3-Coder 72B",    company:"阿里云",           elo:1435, sweBench:76.2, humanEval:87.5, mbpp:80.8, score:87.6 },
  { rank:9,  model:"GitHub Copilot X",   company:"GitHub/OpenAI",   elo:1428, sweBench:75.1, humanEval:86.3, mbpp:79.4, score:86.8 },
  { rank:10, model:"Mistral Large 3",    company:"Mistral AI",      elo:1415, sweBench:73.8, humanEval:84.7, mbpp:77.9, score:85.3 }
];

const COLORS = ['#e94560','#0f3460','#533483','#06b6d4','#10b981','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316'];

// 渲染表格
const tbody = document.getElementById('rank-tbody');
tbody.innerHTML = benchmarkData.map(d => {
  const rc = d.rank <= 3 ? `r${d.rank}` : 'rn';
  const pct = ((d.score - 82) / 14 * 100).toFixed(0);
  return `<tr>
    <td><span class="rank-badge ${rc}">${d.rank}</span></td>
    <td>
      <div class="model-name">${d.model}</div>
      <div class="company">${d.company}</div>
    </td>
    <td>${d.elo}</td>
    <td>${d.sweBench}%</td>
    <td>${d.humanEval}%</td>
    <td>${d.mbpp}%</td>
    <td>
      <div class="score-cell">
        <span class="score-num">${d.score}</span>
        <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
      </div>
    </td>
  </tr>`;
}).join('');

const labels = benchmarkData.map(d => d.model);
const shortLabels = benchmarkData.map(d => d.model.length > 12 ? d.model.slice(0,12)+'…' : d.model);

// Elo 柱状图
new Chart(document.getElementById('eloChart'), {
  type: 'bar',
  data: { labels: shortLabels, datasets: [{ data: benchmarkData.map(d=>d.elo), backgroundColor: COLORS, borderRadius: 5 }] },
  options: { plugins:{legend:{display:false}}, scales:{ y:{ min:1390, ticks:{font:{size:11}} }, x:{ticks:{font:{size:10},maxRotation:30}} } }
});

// SWE-bench 柱状图
new Chart(document.getElementById('sweChart'), {
  type: 'bar',
  data: { labels: shortLabels, datasets: [{ data: benchmarkData.map(d=>d.sweBench), backgroundColor: COLORS, borderRadius: 5 }] },
  options: { plugins:{legend:{display:false}}, scales:{ y:{ min:70, ticks:{callback:v=>v+'%', font:{size:11}} }, x:{ticks:{font:{size:10},maxRotation:30}} } }
});

// HumanEval 折线图
new Chart(document.getElementById('humanChart'), {
  type: 'line',
  data: {
    labels: shortLabels,
    datasets: [{
      data: benchmarkData.map(d=>d.humanEval),
      borderColor: '#0f3460', backgroundColor: 'rgba(15,52,96,0.1)',
      borderWidth: 2.5, pointBackgroundColor: COLORS, pointRadius: 5, tension: 0.3, fill: true
    }]
  },
  options: { plugins:{legend:{display:false}}, scales:{ y:{ min:82, ticks:{callback:v=>v+'%', font:{size:11}} }, x:{ticks:{font:{size:10},maxRotation:30}} } }
});

// MBPP 雷达图（取前6名）
const radarData = benchmarkData.slice(0, 6);
new Chart(document.getElementById('mbppChart'), {
  type: 'radar',
  data: {
    labels: radarData.map(d => d.model.length > 10 ? d.model.slice(0,10)+'…' : d.model),
    datasets: [{
      label: 'MBPP',
      data: radarData.map(d=>d.mbpp),
      backgroundColor: 'rgba(233,69,96,0.15)',
      borderColor: '#e94560',
      pointBackgroundColor: COLORS.slice(0,6),
      pointRadius: 5, borderWidth: 2
    }]
  },
  options: {
    plugins:{ legend:{ display:false } },
    scales:{ r:{ min:78, max:92, ticks:{ stepSize:2, font:{size:10} }, pointLabels:{ font:{size:10} } } }
  }
});
</script>
</body>
</html>
