function renderModules(modules, containerId, summaryId, isStory) {
  const maxTotal = Math.max(...modules.map(m=>m.total));
  const container = document.getElementById(containerId);
  container.innerHTML = modules.map(m => {
    const pct = (m.done/m.total*100).toFixed(0);
    const barClass = isStory ? 'progress-story' : 'progress-bug';
    return `<div class="module-row">
      <div class="module-name" title="${m.name}">${m.name}</div>
      <div class="progress-wrap"><div class="progress-bar ${barClass}" style="width:${pct}%"></div></div>
      <div class="module-stats"><span>${m.done}</span>/${m.total} · ${pct}%</div>
    </div>`;
  }).join('');

  const total = modules.reduce((s,m)=>s+m.total,0);
  const done = modules.reduce((s,m)=>s+m.done,0);
  const inprog = modules.reduce((s,m)=>s+m.progress,0);
  const pending = modules.reduce((s,m)=>s+m.pending,0);
  const rate = (done/total*100).toFixed(0);
  const color = isStory ? 'green' : 'red';
  document.getElementById(summaryId).innerHTML = `
    <div class="summary-item"><div class="summary-num ${color}">${total}</div><div class="summary-label">总计</div></div>
    <div class="summary-item"><div class="summary-num green">${done}</div><div class="summary-label">已完成</div></div>

    <div class="summary-item"><div class="summary-num ${color}">${rate}%</div><div class="summary-label">${isStory?'完成率':'修复率'}</div></div>
  `;
}
