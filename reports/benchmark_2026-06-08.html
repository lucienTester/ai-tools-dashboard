<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI编程工具 TOP10 评测报告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}
h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.subtitle{text-align:center;color:#94a3b8;font-size:.9rem;margin-bottom:28px}
.table-wrap{overflow-x:auto;margin-bottom:32px;border-radius:12px;background:#1e293b;box-shadow:0 4px 24px rgba(0,0,0,.3)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead{background:#334155}
th{padding:10px 12px;text-align:center;color:#94a3b8;font-weight:600;white-space:nowrap}
td{padding:9px 12px;text-align:center;border-top:1px solid #334155}
tbody tr:hover{background:#263348}
.rank{font-weight:700;color:#60a5fa}
.rank-1{color:#fbbf24}.rank-2{color:#c0c0c0}.rank-3{color:#cd7f32}
.model-name{font-weight:600;color:#e2e8f0}
.company{color:#94a3b8}
.score-bar{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);vertical-align:middle;margin-left:6px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
.chart-box{background:#1e293b;border-radius:12px;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.chart-box h3{font-size:.95rem;color:#94a3b8;margin-bottom:12px;text-align:center}
.chart-box canvas{width:100%!important}
footer{text-align:center;color:#64748b;font-size:.78rem;padding:16px 0;border-top:1px solid #1e293b}
@media(max-width:768px){.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>🤖 AI编程工具 TOP10 评测报告</h1>
<p class="subtitle">2026-06-08 · 基于 LMArena Elo / SWE-bench / HumanEval / MBPP 综合评分</p>

<div class="table-wrap">
<table>
<thead>
<tr><th>排名</th><th>模型</th><th>公司</th><th>Elo</th><th>SWE-bench</th><th>HumanEval</th><th>MBPP</th><th>综合评分</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="charts">
<div class="chart-box"><h3>📊 LMArena Elo 评分</h3><canvas id="eloChart"></canvas></div>
<div class="chart-box"><h3>📊 SWE-bench 得分</h3><canvas id="sweChart"></canvas></div>
<div class="chart-box"><h3>📈 HumanEval 得分</h3><canvas id="humanChart"></canvas></div>
<div class="chart-box"><h3>🕸️ MBPP 雷达图</h3><canvas id="radarChart"></canvas></div>
</div>

<footer>数据来源：LMArena · SWE-bench · HumanEval · MBPP &nbsp;|&nbsp; 综合评分 = Elo×0.3 + SWE×0.3 + HumanEval×0.2 + MBPP×0.2</footer>
</div>

<script>
const D=[
  {rank:1,model:"Claude 4.6 Sonnet",company:"Anthropic",elo:1538,sweBench:83.2,humanEval:94.1,mbpp:87.6,score:95.1},
  {rank:2,model:"Gemini 3.0 Pro",company:"Google DeepMind",elo:1512,sweBench:81.8,humanEval:92.3,mbpp:85.4,score:93.4},
  {rank:3,model:"GPT-5 High",company:"OpenAI",elo:1498,sweBench:80.5,humanEval:91.8,mbpp:84.2,score:92.0},
  {rank:4,model:"DeepSeek V4",company:"DeepSeek",elo:1476,sweBench:80.1,humanEval:95.3,mbpp:88.7,score:91.8},
  {rank:5,model:"Kimi 2.5",company:"月之暗面",elo:1452,sweBench:78.6,humanEval:90.2,mbpp:83.1,score:89.5},
  {rank:6,model:"GLM-5",company:"智谱AI",elo:1448,sweBench:77.9,humanEval:89.4,mbpp:82.5,score:88.9},
  {rank:7,model:"Cursor (Agent 2.0)",company:"Anysphere",elo:1441,sweBench:76.8,humanEval:88.1,mbpp:81.3,score:88.2},
  {rank:8,model:"Qwen3-Coder 72B",company:"阿里云",elo:1435,sweBench:76.2,humanEval:87.5,mbpp:80.8,score:87.6},
  {rank:9,model:"GitHub Copilot X",company:"GitHub/OpenAI",elo:1428,sweBench:75.1,humanEval:86.3,mbpp:79.4,score:86.8},
  {rank:10,model:"Mistral Large 3",company:"Mistral AI",elo:1415,sweBench:73.8,humanEval:84.7,mbpp:77.9,score:85.3}
];
const labels=D.map(d=>d.model);
const colors=['#fbbf24','#60a5fa','#34d399','#f472b6','#a78bfa','#fb923c','#38bdf8','#4ade80','#e879f9','#f87171'];
const bgColors=colors.map(c=>c+'33');

// Table
const tbody=document.getElementById('tbody');
D.forEach(d=>{
  const rc=d.rank<=3?`rank rank-${d.rank}`:'rank';
  const bw=Math.round((d.score-80)*10);
  tbody.innerHTML+=`<tr><td class="${rc}">${d.rank}</td><td class="model-name">${d.model}</td><td class="company">${d.company}</td><td>${d.elo}</td><td>${d.sweBench}%</td><td>${d.humanEval}%</td><td>${d.mbpp}%</td><td><strong>${d.score}</strong><span class="score-bar" style="width:${bw}px"></span></td></tr>`;
});

// Chart defaults
Chart.defaults.color='#94a3b8';
Chart.defaults.borderColor='#334155';
const commonOpts={indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e293b'}},y:{grid:{display:false},ticks:{font:{size:11}}}}};

// Elo bar
new Chart(document.getElementById('eloChart'),{type:'bar',data:{labels,datasets:[{data:D.map(d=>d.elo),backgroundColor:bgColors,borderColor:colors,borderWidth:1.5,borderRadius:4}]},options:{...commonOpts,scales:{...commonOpts.scales,x:{...commonOpts.scales.x,min:1380,max:1560}}}});

// SWE-bench bar
new Chart(document.getElementById('sweChart'),{type:'bar',data:{labels,datasets:[{data:D.map(d=>d.sweBench),backgroundColor:bgColors,borderColor:colors,borderWidth:1.5,borderRadius:4}]},options:{...commonOpts,scales:{...commonOpts.scales,x:{...commonOpts.scales.x,min:68,max:88}}}});

// HumanEval line
new Chart(document.getElementById('humanChart'),{type:'line',data:{labels,datasets:[{data:D.map(d=>d.humanEval),borderColor:'#34d399',backgroundColor:'#34d39922',fill:true,tension:.4,pointBackgroundColor:colors,pointRadius:5,pointBorderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e293b'},ticks:{font:{size:10},maxRotation:45}},y:{min:82,max:98,grid:{color:'#1e293b'}}}}});

// Radar
const top5=D.slice(0,5);
new Chart(document.getElementById('radarChart'),{type:'radar',data:{labels:['Elo(÷16)','SWE-bench','HumanEval','MBPP'],datasets:top5.map((d,i)=>({label:d.model,data:[+(d.elo/16).toFixed(1),d.sweBench,d.humanEval,d.mbpp],borderColor:colors[i],backgroundColor:colors[i]+'22',pointBackgroundColor:colors[i],borderWidth:2}))},options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:80,max:100,grid:{color:'#334155'},angleLines:{color:'#334155'},pointLabels:{color:'#94a3b8',font:{size:11}},ticks:{display:false}}},plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',font:{size:10},boxWidth:12,padding:8}}}}});
</script>
</body>
</html>
