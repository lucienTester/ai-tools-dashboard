<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI编程工具 TOP10 评测报告 - 2026-04-24</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 0 30px;border-bottom:1px solid #1e293b;margin-bottom:30px}
header h1{font-size:2rem;background:linear-gradient(135deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
header .subtitle{color:#94a3b8;font-size:.95rem}
.date-badge{display:inline-block;margin-top:12px;padding:4px 16px;border-radius:20px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;font-size:.85rem}
.section{margin-bottom:36px}
.section-title{font-size:1.15rem;color:#e2e8f0;margin-bottom:16px;padding-left:12px;border-left:3px solid #818cf8}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
thead{background:#334155}
th{padding:12px 10px;text-align:center;font-size:.8rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:10px;text-align:center;font-size:.85rem;border-top:1px solid #334155}
tr:hover{background:rgba(56,189,248,.05)}
.rank{font-weight:700;width:50px}
.rank-1{color:#fbbf24;font-size:1.1rem}.rank-2{color:#94a3b8}.rank-3{color:#cd7f32}
.model-name{font-weight:600;color:#e2e8f0;text-align:left;padding-left:14px}
.company{color:#94a3b8;font-size:.8rem}
.score-bar{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,#38bdf8,#818cf8);vertical-align:middle;margin-left:6px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-card{background:#1e293b;border-radius:12px;padding:20px}
.chart-card h3{font-size:.9rem;color:#94a3b8;margin-bottom:12px}
.chart-card canvas{width:100%!important;max-height:280px}
footer{text-align:center;padding:30px 0 20px;color:#64748b;font-size:.8rem;border-top:1px solid #1e293b;margin-top:20px}
footer span{color:#94a3b8}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}header h1{font-size:1.5rem}th,td{padding:8px 6px;font-size:.75rem}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏆 AI编程工具 TOP10 评测报告</h1>
    <p class="subtitle">AI Coding & AI Agent 综合评测排名</p>
    <div class="date-badge">📅 2026年4月24日</div>
  </header>

  <div class="section">
    <div class="section-title">📊 综合评测数据</div>
    <table>
      <thead>
        <tr><th>排名</th><th>模型</th><th>公司</th><th>Elo</th><th>SWE-bench</th><th>HumanEval</th><th>MBPP</th><th>综合评分</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">📈 可视化图表</div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Elo 评分柱状图</h3><canvas id="eloChart"></canvas></div>
      <div class="chart-card"><h3>SWE-bench 柱状图</h3><canvas id="sweChart"></canvas></div>
      <div class="chart-card"><h3>HumanEval 折线图</h3><canvas id="humanChart"></canvas></div>
      <div class="chart-card"><h3>MBPP 雷达图</h3><canvas id="mbppChart"></canvas></div>
    </div>
  </div>

  <footer>
    数据来源：<span>LMArena</span> · <span>SWE-bench</span> · <span>HumanEval</span> · <span>MBPP</span><br>
    <span style="margin-top:6px;display:inline-block">© 2026 AI Tools Dashboard</span>
  </footer>
</div>

<script>
const data=[
  {rank:1,model:"Claude 4.6 Sonnet",company:"Anthropic",elo:1538,sweBench:83.2,humanEval:94.1,mbpp:87.6,score:95.1},
  {rank:2,model:"Gemini 3.0 Pro",company:"Google DeepMind",elo:1512,sweBench:81.8,humanEval:92.3,mbpp:85.4,score:93.4},
  {rank:3,model:"GPT-5 High",company:"OpenAI",elo:1498,sweBench:80.5,humanEval:91.8,mbpp:84.2,score:92.0},
  {rank:4,model:"DeepSeek V4",company:"DeepSeek",elo:1476,sweBench:80.1,humanEval:95.3,mbpp:88.7,score:91.8},
  {rank:5,model:"Kimi 2.5",company:"月之暗面",elo:1452,sweBench:78.6,humanEval:90.2,mbpp:83.1,score:89.5},
  {rank:6,model:"GLM-5",company:"智谱AI",elo:1448,sweBench:77.9,humanEval:89.4,mbpp:82.5,score:88.9},
  {rank:7,model:"Cursor (Agent 2.0)",company:"Anysphere",elo:1441,sweBench:76.8,humanEval:88.1,mbpp:81.3,score:88.2},
  {rank:8,model:"Qwen3-Coder 72B",company:"阿里云",elo:1435,sweBench:76.2,humanEval:87.5,mbpp:80.8,score:87.6},
  {rank:9,model:"GitHub Copilot X",company:"GitHub/OpenAI",elo:1428,sweBench:75.1,humanEval:86.3,mbpp:79.4,score:86.8},
  {rank:10,model:"Mistral Large 3",company:"Mistral AI",elo:1415,sweBench:73.8,humanEval:84.7,mbpp:77.9,score:85.3}
];
const labels=data.map(d=>d.model);
const colors=['#fbbf24','#38bdf8','#818cf8','#c084fc','#f472b6','#fb923c','#34d399','#60a5fa','#a78bfa','#f87171'];
const bgColors=colors.map(c=>c+'33');

// Table
const tbody=document.getElementById('tbody');
data.forEach(d=>{
  const rc=d.rank<=3?`rank-${d.rank}`:'';
  const bw=(d.score-80)*10;
  tbody.innerHTML+=`<tr><td class="rank ${rc}">${d.rank<=3?['🥇','🥈','🥉'][d.rank-1]:d.rank}</td><td class="model-name">${d.model}</td><td class="company">${d.company}</td><td>${d.elo}</td><td>${d.sweBench}%</td><td>${d.humanEval}%</td><td>${d.mbpp}%</td><td style="font-weight:700;color:#38bdf8">${d.score}<span class="score-bar" style="width:${bw}px"></span></td></tr>`;
});

const chartOpts={responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'#334155'}},y:{ticks:{color:'#94a3b8'},grid:{color:'#33415533'}}}};

// Elo bar
new Chart(document.getElementById('eloChart'),{type:'bar',data:{labels,datasets:[{data:data.map(d=>d.elo),backgroundColor:bgColors,borderColor:colors,borderWidth:1}]},options:{...chartOpts,scales:{...chartOpts.scales,y:{...chartOpts.scales.y,min:1400,max:1560}}}});

// SWE-bench bar
new Chart(document.getElementById('sweChart'),{type:'bar',data:{labels,datasets:[{data:data.map(d=>d.sweBench),backgroundColor:bgColors,borderColor:colors,borderWidth:1}]},options:{...chartOpts,scales:{...chartOpts.scales,y:{...chartOpts.scales.y,min:70,max:86}}}});

// HumanEval line
new Chart(document.getElementById('humanChart'),{type:'line',data:{labels,datasets:[{data:data.map(d=>d.humanEval),borderColor:'#38bdf8',backgroundColor:'rgba(56,189,248,.1)',fill:true,tension:.3,pointBackgroundColor:colors,pointRadius:5}]},options:{...chartOpts,scales:{...chartOpts.scales,y:{...chartOpts.scales.y,min:82,max:98}}}});

// MBPP radar - top 5
const radarLabels=['Elo(归一化)','SWE-bench','HumanEval','MBPP','综合评分'];
const top5=data.slice(0,5);
new Chart(document.getElementById('mbppChart'),{type:'radar',data:{labels:radarLabels,datasets:top5.map((d,i)=>({label:d.model,data:[(d.elo-1400)/(1560-1400)*100,d.sweBench,d.humanEval,d.mbpp,d.score],borderColor:colors[i],backgroundColor:colors[i]+'22',pointBackgroundColor:colors[i]}))},options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:9}}}},scales:{r:{ticks:{color:'#64748b',backdropColor:'transparent',font:{size:9}},grid:{color:'#334155'},pointLabels:{color:'#94a3b8',font:{size:10}},min:60,max:100}}}});
</script>
</body>
</html>
